    <div>${lbl('Buscar',`<input class="${inp}" value="${esc(F.q)}" placeholder="ex.: pressão, cobertura…" oninput="F.q=this.value;$('#res').innerHTML=res()">`)}</div>
  </div>
  <label class="mb-3 flex items-center gap-2 text-sm"><input type="checkbox" ${F.hide?'checked':''} onchange="F.hide=this.checked;render()"> Ocultar já dominados</label>
  <div id="prog" class="mb-5">${prog()}</div><div id="res">${res()}</div>`}
function tog(id){const i=S.itens.find(x=>x.id===id);i.dominado=!i.dominado;save();$('#res').innerHTML=res();$('#prog').innerHTML=prog()}
function del(id){const i=S.itens.find(x=>x.id===id);if(confirm(`Excluir "${i.comportamento}"?`)){S.itens=S.itens.filter(x=>x.id!==id);save();render()}}
function edit(id){EDIT=id;go('banco')}

/* ---------- Exercício ---------- */
function gerar(){
  const pos=EF.pos||pick(poss()),lado=EF.lado||pick(['mandante','visitante']),flanco=/lateral|ponta/i.test(pos)?pick(['esquerdo','direito']):'';
  const mom=EF.mom||pick(moms().filter(m=>S.itens.some(i=>i.posicao===pos&&i.momento===m)));
  let pool=S.itens.filter(i=>i.posicao===pos&&i.momento===mom);
  pool=EF.pri?[...shuffle(pool.filter(i=>!i.dominado)),...shuffle(pool.filter(i=>i.dominado))]:shuffle(pool);
  if(!pool.length){toast('Sem comportamentos para essa combinação');return}
  EX={pos,lado,flanco,mom,itens:pool.slice(0,EF.n).map(i=>({c:i.comportamento,d:i.descricao,obs:false,nota:'',r:i.refs||[]})),salvo:false};render();
}
function vExercicio(){
  const f=`<div class="${card} mb-5"><div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
    <div>${lbl('Posição',`<select class="${inp}" onchange="EF.pos=this.value">${opts(poss(),EF.pos,'🎲 Aleatória')}</select>`)}</div>
    <div>${lbl('Time',`<select class="${inp}" onchange="EF.lado=this.value">${opts(['mandante','visitante'],EF.lado,'🎲 Aleatório')}</select>`)}</div>
    <div>${lbl('Fase do jogo',`<select class="${inp}" onchange="EF.mom=this.value">${opts(moms(),EF.mom,'🎲 Aleatória')}</select>`)}</div>
    <div>${lbl('Nº de comportamentos',`<select class="${inp}" onchange="EF.n=+this.value">${[2,3,4,5,6].map(n=>`<option ${n===EF.n?'selected':''}>${n}</option>`).join('')}</select>`)}</div></div>
    <label class="mt-3 flex items-center gap-2 text-sm"><input type="checkbox" ${EF.pri?'checked':''} onchange="EF.pri=this.checked"> Priorizar comportamentos que ainda não domino</label>
    <button onclick="gerar()" class="${PRI} mt-3">🎯 Gerar exercício</button></div>`;
  let ex='';
  if(EX){const e=EX;ex=`<div class="${card}"><p class="text-xs font-medium uppercase tracking-wide text-stone-500">Seu exercício</p>
    <p class="mt-1 text-base">Assista a uma partida e analise o <b>${esc(e.pos)}${e.flanco?' do lado '+e.flanco:''}</b> do time <b>${e.lado}</b>, focando na fase de ${badge(e.mom)}</p>
    <p class="mt-1 text-sm text-stone-500">${esc(S.momentos[e.mom]||'')}</p>
    <div class="mt-4 grid gap-3">${e.itens.map((i,k)=>`<div class="rounded-lg border border-stone-200 p-3 dark:border-stone-800">
      <label class="flex items-start gap-2"><input type="checkbox" class="mt-1" ${i.obs?'checked':''} onchange="EX.itens[${k}].obs=this.checked"><span><b>${esc(i.c)}</b><br><span class="text-sm text-stone-600 dark:text-stone-400">${esc(i.d)}</span><span class="mt-1 block">${refLinks(i.r)}</span></span></label>
      <textarea rows="2" class="${inp} mt-2" placeholder="O que você observou? (minuto, contexto, exemplo…)" oninput="EX.itens[${k}].nota=this.value">${esc(i.nota)}</textarea></div>`).join('')}</div>
    <div class="mt-4 flex flex-wrap gap-2"><button onclick="salvarEx()" class="${PRI}">💾 Salvar no histórico</button><button onclick="gerar()" class="${SEC}">🔁 Gerar outro</button></div></div>`}
  const h=S.hist.length?`<h3 class="mb-2 mt-8 font-semibold">Histórico (${S.hist.length})</h3><div class="grid gap-2">${S.hist.map((x,k)=>`<details class="${card} !p-3"><summary class="cursor-pointer text-sm"><b>${esc(x.pos)}${x.flanco?' '+x.flanco:''}</b> · ${x.lado} · ${esc(x.mom)} <span class="text-stone-500">— ${esc(x.data)}</span></summary>
    <ul class="mt-2 grid gap-1 text-sm">${x.itens.map(i=>`<li>${i.obs?'✅':'⬜'} <b>${esc(i.c)}</b>${i.nota?`<br><span class="text-stone-500">${esc(i.nota)}</span>`:''}</li>`).join('')}</ul>
    <button onclick="delH(${k})" class="mt-2 text-xs text-rose-600">Excluir</button></details>`).join('')}</div>`:'';
  return f+ex+h;
}
function salvarEx(){if(!EX||EX.salvo)return toast('Já salvo');S.hist.unshift({pos:EX.pos,lado:EX.lado,flanco:EX.flanco,mom:EX.mom,data:new Date().toLocaleString('pt-BR'),itens:EX.itens.map(i=>({c:i.c,obs:i.obs,nota:i.nota}))});S.hist=S.hist.slice(0,50);EX.salvo=true;save();toast('Salvo no histórico');render()}
function delH(k){S.hist.splice(k,1);save();render()}

/* ---------- Adicionar / Editar ---------- */
function vBanco(){
  const it=EDIT?S.itens.find(i=>i.id===EDIT):null,v=it||{posicao:'',momento:'',comportamento:'',descricao:''};
  return `<div class="${card}"><h3 class="mb-3 font-semibold">${it?'Editar comportamento':'Novo comportamento'}</h3><div class="grid gap-3">
  <div class="grid gap-3 sm:grid-cols-2"><div>${lbl('Posição',`<input id="f_pos" list="dl" class="${inp}" value="${esc(v.posicao)}" placeholder="ex.: Zagueiro"><datalist id="dl">${poss().map(p=>`<option value="${esc(p)}">`).join('')}</datalist>`)}</div>
  <div>${lbl('Fase do jogo',`<select id="f_mom" class="${inp}">${opts(moms(),v.momento)}</select>`)}</div></div>
  <div>${lbl('Comportamento',`<input id="f_comp" class="${inp}" value="${esc(v.comportamento)}">`)}</div>
  <div>${lbl('Breve descrição',`<textarea id="f_desc" rows="3" class="${inp}">${esc(v.descricao)}</textarea>`)}</div>
  <div class="flex gap-2"><button onclick="salvarItem()" class="${PRI}">${it?'Salvar alterações':'Adicionar'}</button>${it?`<button onclick="EDIT=null;render()" class="${SEC}">Cancelar</button>`:''}</div></div></div>`}
function salvarItem(){
  const posicao=$('#f_pos').value.trim(),momento=$('#f_mom').value,comportamento=$('#f_comp').value.trim(),descricao=$('#f_desc').value.trim();
  if(!posicao||!comportamento)return toast('Preencha posição e comportamento');
  if(EDIT){Object.assign(S.itens.find(i=>i.id===EDIT),{posicao,momento,comportamento,descricao});EDIT=null}
  else S.itens.push({id:nid(),posicao,momento,comportamento,descricao,dominado:false});
  save();toast('Salvo!');F.pos=posicao;go('consulta');
}

/* ---------- Referências de vídeo ---------- */
let RF={pos:'',id:'',titulo:'',url:'',t:'',jogador:'',jogo:'',nota:'',pf:'',q:''};
const ytUrl=(u,t)=>{if(!t)return u;const p=String(t).split(':').reverse().map(Number),s=(p[0]||0)+(p[1]||0)*60+(p[2]||0)*3600;try{const x=new URL(u);if(/youtu/.test(x.hostname)&&s){x.searchParams.set('t',s+'s');return x.href}}catch(e){}return u};
const refLinks=r=>(r||[]).map(x=>`<a href="${esc(ytUrl(x.url,x.t))}" target="_blank" rel="noopener" class="mr-2 inline-block text-xs text-emerald-700 underline dark:text-emerald-400">▶ ${esc(x.titulo||'vídeo')}${x.t?' ('+esc(x.t)+')':''}</a>`).join('');
function rlist(){
  const q=RF.q.toLowerCase();
  const l=S.itens.filter(i=>(i.refs||[]).length&&(!RF.pf||i.posicao===RF.pf)).map(i=>({...i,refs:i.refs.filter(r=>!q||[r.titulo,r.jogador,r.jogo,r.nota,i.comportamento].join(' ').toLowerCase().includes(q))})).filter(i=>i.refs.length);
  if(!l.length)return '<p class="py-8 text-center text-sm text-stone-500">Nenhuma referência ainda. Cadastre o primeiro vídeo acima.</p>';
  return l.map(i=>`<section class="${card} mb-3"><div class="mb-2 flex flex-wrap items-center gap-2"><b>${esc(i.comportamento)}</b><span class="text-xs text-stone-500">${esc(i.posicao)}</span>${badge(i.momento)}</div><div class="grid gap-2">${i.refs.map(r=>`<div class="rounded-lg border border-stone-200 p-2 text-sm dark:border-stone-800"><div class="flex items-start justify-between gap-2"><div class="min-w-0">${refLinks([r])}<div class="text-xs text-stone-500">${[r.jogador,r.jogo].filter(Boolean).map(esc).join(' · ')}</div>${r.nota?`<p class="mt-1 text-stone-600 dark:text-stone-400">${esc(r.nota)}</p>`:''}</div><button onclick="delRef(${i.id},${r.id})" class="text-xs text-rose-600">Excluir</button></div></div>`).join('')}</div></section>`).join('');
}
function vBiblio(){
  const its=S.itens.filter(i=>!RF.pos||i.posicao===RF.pos);
  const f=(k,l,ph)=>`<div>${lbl(l,`<input class="${inp}" value="${esc(RF[k])}" placeholder="${ph}" oninput="RF.${k}=this.value">`)}</div>`;
  return `<div class="${card} mb-5"><h3 class="mb-1 font-semibold">Adicionar vídeo de referência</h3><p class="mb-3 text-xs text-stone-500">Cole o link (no YouTube o início em mm:ss é aplicado) e ligue o lance a um comportamento. Só o link e suas anotações ficam salvos, não o vídeo.</p><div class="grid gap-3 sm:grid-cols-2">
  <div>${lbl('Posição',`<select class="${inp}" onchange="RF.pos=this.value;RF.id='';render()">${opts(poss(),RF.pos,'Selecione')}</select>`)}</div>
  <div>${lbl('Comportamento',`<select class="${inp}" onchange="RF.id=+this.value"><option value="">Selecione</option>${its.map(i=>`<option value="${i.id}" ${i.id===RF.id?'selected':''}>${esc(i.comportamento)} — ${esc(i.momento)}</option>`).join('')}</select>`)}</div>
  ${f('titulo','Título','ex.: Cobertura do lateral')}${f('url','Link do vídeo','https://…')}${f('t','Início (mm:ss)','12:30')}${f('jogador','Jogador','')}${f('jogo','Jogo / competição','')}
  <div class="sm:col-span-2">${lbl('O que observar neste lance',`<textarea rows="2" class="${inp}" oninput="RF.nota=this.value">${esc(RF.nota)}</textarea>`)}</div></div>
  <button onclick="addRef()" class="${PRI} mt-3">Salvar referência</button></div>
  <div class="mb-3 grid gap-3 sm:grid-cols-2"><div>${lbl('Filtrar posição',`<select class="${inp}" onchange="RF.pf=this.value;$('#rl').innerHTML=rlist()">${opts(poss(),RF.pf,'Todas')}</select>`)}</div><div>${lbl('Buscar',`<input class="${inp}" value="${esc(RF.q)}" oninput="RF.q=this.value;$('#rl').innerHTML=rlist()">`)}</div></div><div id="rl">${rlist()}</div>`;
}
function addRef(){
  const it=S.itens.find(i=>i.id===RF.id);if(!it)return toast('Escolha o comportamento');
  if(!/^https?:\/\//i.test(RF.url.trim()))return toast('Informe um link http(s)');
  (it.refs=it.refs||[]).push({id:Date.now()+Math.random(),titulo:RF.titulo.trim(),url:RF.url.trim(),t:RF.t.trim(),jogador:RF.jogador.trim(),jogo:RF.jogo.trim(),nota:RF.nota.trim()});
  Object.assign(RF,{titulo:'',url:'',t:'',nota:''});save();toast('Referência salva');render();
}
function delRef(id,rid){const it=S.itens.find(i=>i.id===id);if(confirm('Excluir esta referência?')){it.refs=it.refs.filter(r=>r.id!==rid);save();$('#rl').innerHTML=rlist()}}
const openRef=id=>{const i=S.itens.find(x=>x.id===id);Object.assign(RF,{pos:i.posicao,id});go('biblio')};

/* ---------- Flashcards ---------- */
let FC={pos:'',mom:'',only:true,mode:'d2c',deck:[],i:0,flip:false,ok:0,on:false};
const fcPool=()=>S.itens.filter(i=>(!FC.pos||i.posicao===FC.pos)&&(!FC.mom||i.momento===FC.mom)&&(!FC.only||!i.dominado));
function fcStart(){const p=fcPool();if(!p.length)return toast('Nenhum card nessa seleção');Object.assign(FC,{deck:shuffle(p).map(i=>i.id),i:0,flip:false,ok:0,on:true});render()}
function fcAns(ok){const it=S.itens.find(x=>x.id===FC.deck[FC.i]);if(it){it.dominado=ok;save()}if(ok)FC.ok++;FC.i++;FC.flip=false;render()}
function vFlash(){
  if(!FC.on)return `<div class="${card}"><h3 class="mb-3 font-semibold">Flashcards</h3><div class="grid gap-3 sm:grid-cols-2">
  <div>${lbl('Posição',`<select class="${inp}" onchange="FC.pos=this.value;render()">${opts(poss(),FC.pos,'Todas')}</select>`)}</div>
  <div>${lbl('Fase do jogo',`<select class="${inp}" onchange="FC.mom=this.value;render()">${opts(moms(),FC.mom,'Todas')}</select>`)}</div>
  <div class="sm:col-span-2">${lbl('Modo',`<select class="${inp}" onchange="FC.mode=this.value"><option value="d2c" ${FC.mode==='d2c'?'selected':''}>Descrição → Comportamento (mais difícil)</option><option value="c2d" ${FC.mode==='c2d'?'selected':''}>Comportamento → Descrição</option></select>`)}</div></div>
  <label class="mt-3 flex items-center gap-2 text-sm"><input type="checkbox" ${FC.only?'checked':''} onchange="FC.only=this.checked;render()"> Só os que ainda não domino</label>
  <button onclick="fcStart()" class="${PRI} mt-3">Começar (${fcPool().length} cards)</button></div>`;
  if(FC.i>=FC.deck.length)return `<div class="${card} text-center"><p class="text-lg font-semibold">Fim do baralho!</p><p class="mt-1 text-sm text-stone-500">Você acertou ${FC.ok} de ${FC.deck.length}. Acertos viram "dominados"; o que você marcou para revisar volta como não dominado.</p><div class="mt-4 flex justify-center gap-2"><button onclick="fcStart()" class="${PRI}">Novo baralho</button><button onclick="FC.on=false;render()" class="${SEC}">Configurar</button></div></div>`;
  const it=S.itens.find(x=>x.id===FC.deck[FC.i]);if(!it){FC.i++;return vFlash()}
  const d2=FC.mode==='d2c',front=d2?`<p class="text-lg">${esc(it.descricao)}</p>`:`<p class="text-xl font-semibold">${esc(it.comportamento)}</p>`,back=d2?`<p class="text-xl font-semibold">${esc(it.comportamento)}</p>`:`<p class="text-lg">${esc(it.descricao)}</p>`;
  return `<div class="mb-2 flex items-center justify-between text-xs text-stone-500"><span>Card ${FC.i+1} de ${FC.deck.length}</span><button onclick="FC.on=false;render()">Encerrar</button></div>
  <div class="${card} min-h-[14rem] !p-6"><div class="mb-4 flex flex-wrap items-center gap-2"><span class="text-xs font-medium text-stone-500">${esc(it.posicao)}</span>${badge(it.momento)}</div>${front}
  ${FC.flip?`<hr class="my-4 border-stone-200 dark:border-stone-800">${back}<div class="mt-3">${refLinks(it.refs)}</div>`:''}</div>
  <div class="mt-3 flex gap-2">${FC.flip?`<button onclick="fcAns(true)" class="${PRI} flex-1">✅ Sabia</button><button onclick="fcAns(false)" class="${SEC} flex-1">🔁 Revisar</button>`:`<button onclick="FC.flip=true;render()" class="${PRI} flex-1">Virar card</button>`}</div>`;
}

/* ---------- Dados ---------- */
let MODE='mesclar';
async function dl(name,data,mime){
  let d=null;try{d=await claude.use('downloads')}catch(e){}
  if(d){try{await d.save({filename:name,data});return}catch(e){if(e&&e.code==='declined')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:mime}));a.download=name;a.click();
}
const expJSON=()=>dl('comportamentos-futebol.json',JSON.stringify({versao:1,momentos:S.momentos,comportamentos:S.itens,historico:S.hist},null,2),'application/json');
function expXLSX(){
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(S.itens.map(i=>({'Posição':i.posicao,'Momento/Fase do Jogo':i.momento,'Comportamento':i.comportamento,'Breve Descrição':i.descricao,'Dominado':i.dominado?'Sim':''}))),'Banco de Comportamentos');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(Object.entries(S.momentos).map(([k,v])=>({'Momento/Fase do Jogo':k,'Definição simples':v}))),'Referência dos Momentos');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(S.itens.flatMap(i=>(i.refs||[]).map(r=>({'Posição':i.posicao,'Momento/Fase do Jogo':i.momento,'Comportamento':i.comportamento,'Título':r.titulo,'URL':r.url,'Início':r.t,'Jogador':r.jogador,'Jogo':r.jogo,'Nota':r.nota})))),'Referências de Vídeo');
  dl('Banco_de_Comportamentos.xlsx',XLSX.write(wb,{type:'array',bookType:'xlsx'}),'application/octet-stream');
}
async function imp(file){
  if(!file)return;let itens=[],momentos={},hist=null;
  try{
    if(/\.json$/i.test(file.name)){const j=JSON.parse(await file.text());itens=(j.comportamentos||[]).map(x=>({posicao:x.posicao,momento:x.momento,comportamento:x.comportamento,descricao:x.descricao||'',dominado:!!x.dominado,refs:x.refs||[]}));momentos=j.momentos||{};hist=j.historico||null}
    else{const wb=XLSX.read(await file.arrayBuffer());const r=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
      itens=r.map(x=>({posicao:String(x['Posição']).trim(),momento:String(x['Momento/Fase do Jogo']).trim(),comportamento:String(x['Comportamento']).trim(),descricao:String(x['Breve Descrição']).trim(),dominado:/^s/i.test(x['Dominado']||'')}));
      const rs=wb.Sheets['Referências de Vídeo'];if(rs)XLSX.utils.sheet_to_json(rs,{defval:''}).forEach(x=>{const it=itens.find(i=>i.posicao===String(x['Posição']).trim()&&i.momento===String(x['Momento/Fase do Jogo']).trim()&&i.comportamento===String(x['Comportamento']).trim());if(it)(it.refs=it.refs||[]).push({id:Date.now()+Math.random(),titulo:String(x['Título']),url:String(x['URL']),t:String(x['Início']),jogador:String(x['Jogador']),jogo:String(x['Jogo']),nota:String(x['Nota'])})});
      if(wb.SheetNames[1])XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[1]]).forEach(x=>momentos[String(x['Momento/Fase do Jogo']).trim()]=String(x['Definição simples']).trim())}
    itens=itens.filter(i=>i.posicao&&i.comportamento);if(!itens.length)throw 0;
  }catch(e){return toast('Arquivo inválido')}
  const k=i=>[i.posicao,i.momento,i.comportamento].join('|').toLowerCase();let add=0;
  if(MODE==='substituir'){S.itens=itens.map((i,n)=>({...i,id:n+1}));S.momentos={...momentos};if(hist)S.hist=hist;add=itens.length}
  else{const have=new Set(S.itens.map(k));itens.forEach(i=>{if(!have.has(k(i))){S.itens.push({...i,id:nid()});have.add(k(i));add++}else if((i.refs||[]).length){const e=S.itens.find(z=>k(z)===k(i));e.refs=e.refs||[];i.refs.forEach(r=>{if(!e.refs.some(q=>q.url===r.url&&q.t===r.t))e.refs.push(r)})}});Object.assign(S.momentos,{...momentos,...S.momentos})}
  [...new Set(S.itens.map(i=>i.momento))].forEach(m=>{if(!S.momentos[m])S.momentos[m]=''});
  save();toast(`${add} comportamento(s) importado(s)`);render();
}
function vDados(){
  return `<div class="grid gap-4"><div class="${card}"><h3 class="font-semibold">Resumo</h3><p class="mt-1 text-sm text-stone-600 dark:text-stone-400">${S.itens.length} comportamentos · ${poss().length} posições · ${S.itens.filter(i=>i.dominado).length} dominados · ${S.hist.length} exercícios no histórico</p>
    <p class="mt-1 text-xs text-stone-500">Tudo fica salvo no localStorage deste navegador. Exporte de tempos em tempos como backup.</p></div>
  <div class="${card}"><h3 class="mb-3 font-semibold">Exportar</h3><div class="flex flex-wrap gap-2"><button onclick="expJSON()" class="${PRI}">⬇ JSON (completo, com progresso)</button><button onclick="expXLSX()" class="${SEC}">⬇ XLSX (formato da planilha)</button></div></div>
  <div class="${card}"><h3 class="mb-3 font-semibold">Importar</h3><div class="grid gap-3 sm:grid-cols-2"><div>${lbl('Modo',`<select class="${inp}" onchange="MODE=this.value">${opts(['mesclar','substituir'],MODE)}</select>`)}</div>
    <div>${lbl('Arquivo (.json ou .xlsx)',`<input type="file" accept=".json,.xlsx" class="${inp}" onchange="imp(this.files[0]);this.value=''">`)}</div></div>
    <p class="mt-2 text-xs text-stone-500">Mesclar adiciona só o que ainda não existe (mesma posição + fase + comportamento). Substituir troca todo o banco.</p></div>
  <div class="${card}"><h3 class="mb-3 font-semibold">Zona de risco</h3><div class="flex flex-wrap gap-2"><button onclick="if(confirm('Zerar marcações de dominado?')){S.itens.forEach(i=>i.dominado=false);save();render()}" class="${SEC}">Zerar progresso</button><button onclick="if(confirm('Restaurar o banco original e apagar suas alterações?')){S=fresh();save();render()}" class="${SEC} !text-rose-600">Restaurar banco original</button></div></div></div>`}
render();
</script>
</body>
